changelog:
  exclude:
    labels:
      - ignore-for-release
      - invalid
      - wontfix
      - duplicate
      - dependabot
  categories:
    - title: Features
      labels:
        - enhancement
        - feature
    - title: Bug Fixes
      labels:
        - bug
        - fix
    - title: Maintenance & CI
      labels:
        - ci
        - chore
        - refactor
        - dependencies
    - title: Documentation
      labels:
        - documentation
        - docs
